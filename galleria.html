<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tocco Magico — Galleria Foto</title>
<meta name="description" content="Galleria fotografica di Tocco Magico Coiffure a Bellinzona. Scopri i nostri lavori, tagli, colori e acconciature.">
<link rel="icon" type="image/png" sizes="32x32" href="IMG/favicon-32.png">
<link rel="icon" type="image/png" href="IMG/favicon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');

  :root {
    --primary: #c9a96e;
    --primary-light: #e2b27f;
    --bg-dark: #0a0a0a;
    --text-light: #f0ece2;
    --text-muted: #a89b8c;
    --card-bg: rgba(10,10,10,0.85);
    --border-gold: rgba(201,169,110,0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-dark);
    color: var(--text-light);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    width: 100%;
    max-width: 100%;
    touch-action: pan-y;
  }

  a { color: var(--primary); text-decoration: none; }
  a:hover { color: var(--primary-light); }

  /* ── HEADER ── */
  header {
    position: relative;
    z-index: 10;
    text-align: center;
    padding: 80px 20px 60px;
    background: var(--bg-dark);
  }

  .back-link {
    position: absolute;
    top: 24px;
    left: 24px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--text-muted);
    transition: color 0.3s ease;
    z-index: 20;
  }

  .back-link:hover { color: var(--primary-light); }

  .back-link svg {
    width: 18px;
    height: 18px;
    transition: transform 0.3s ease;
  }

  .back-link:hover svg { transform: translateX(-3px); }

  header .logo-sm {
    width: 60px;
    margin-bottom: 16px;
    opacity: 0.8;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3.6rem;
    letter-spacing: 3px;
    color: var(--primary-light);
    margin-bottom: 12px;
  }

  header p {
    font-size: 1rem;
    font-weight: 300;
    color: var(--text-muted);
    letter-spacing: 5px;
    text-transform: uppercase;
  }

  /* ── SEZIONE FEATURED ── */
  .featured {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 60px 20px 20px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--primary);
    margin-bottom: 48px;
    text-align: center;
    letter-spacing: 3px;
  }

  .section-divider {
    display: block;
    width: 60px;
    height: 1px;
    background: var(--primary);
    margin: 0 auto 16px;
    opacity: 0.5;
  }

  .section-subtitle {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.95rem;
    font-weight: 300;
    margin-top: -36px;
    margin-bottom: 48px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 40px;
    margin-bottom: 64px;
    background: var(--card-bg);
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    padding: 28px;
    backdrop-filter: blur(10px);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 60px rgba(201,169,110,0.1);
  }

  .card:nth-child(even) { flex-direction: row-reverse; }

  .card img {
    width: 220px;
    height: 160px;
    object-fit: cover;
    border-radius: 12px;
    flex-shrink: 0;
  }

  .card-text h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--primary-light);
    margin-bottom: 12px;
  }

  .card-text p {
    font-weight: 300;
    line-height: 1.8;
    color: #bfb5a5;
    font-size: 0.95rem;
  }

  /* ── SEPARATORI TRA LE CARD ── */
  .card-separator {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 8px 0 56px;
    opacity: 0.4;
  }

  .card-separator .sep-line {
    flex: 1;
    max-width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
  }

  .card-separator .sep-icon {
    color: var(--primary);
    font-size: 0.7rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    font-family: 'Inter', sans-serif;
  }

  .card-separator .sep-diamond {
    width: 6px;
    height: 6px;
    background: var(--primary);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* ── SEZIONE GRIGLIA ── */
  .grid-section {
    position: relative;
    z-index: 10;
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }

  .grid img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.3s ease, filter 0.3s ease;
    filter: saturate(0.8);
  }

  .grid img:hover {
    transform: scale(1.03);
    filter: saturate(1.1);
  }

  /* ── LIGHTBOX ── */
  .lightbox {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.92);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }

  .lightbox.active { display: flex; }

  .lightbox img {
    max-width: 90%;
    max-height: 90vh;
    border-radius: 8px;
    box-shadow: 0 0 60px rgba(0,0,0,0.5);
  }

  .lightbox-close {
    position: absolute;
    top: 24px;
    right: 32px;
    background: none;
    border: none;
    color: var(--text-light);
    font-size: 2.4rem;
    cursor: pointer;
    line-height: 1;
    transition: color 0.3s ease;
  }

  .lightbox-close:hover { color: var(--primary); }

  /* ── LANG SELECTOR ── */
  .lang-selector { display:flex; gap:4px; align-items:center; justify-content:center; margin-top:20px; }
  .lang-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text-muted);
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .lang-btn:hover { border-color: var(--primary); color: var(--primary); }
  .lang-btn.active { background: rgba(201,169,110,0.15); border-color: var(--primary); color: var(--primary); }

  /* ── FOOTER ── */
  .footer {
    position: relative;
    z-index: 10;
    padding: 42px 20px 28px;
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  .footer p { color: var(--text-muted); font-size: 0.85rem; line-height: 1.6; overflow-wrap: anywhere; }
  .footer-links,
  .social-links { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 14px 22px; margin-top: 20px; }
  .footer-links a { color: var(--text-muted); font-size: 0.82rem; }
  .footer-links a:hover { color: var(--primary); }
  .social-links { gap: 12px; }
  .social-links a { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; }
  .social-links a:hover { border-color: var(--primary); }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .footer { padding-left: 14px; padding-right: 14px; }
    .footer-links { gap: 10px 16px; }
    header h1 { font-size: 2.2rem; }
    header { padding: 100px 20px 40px; }
    .card { flex-direction: column !important; padding: 16px; gap: 20px; }
    .card img { width: 100%; height: 180px; }
    .back-link { top: 16px; left: 16px; }
  }

  @media (max-width: 420px) {
    header p { letter-spacing: 2px; }
    .grid-section { padding-left: 14px; padding-right: 14px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .grid img { height: 150px; }
  }
</style>
</head>

<script>
  const photos = [
    'https://dynl.mktgcdn.com/p/FhHhtbMGb0-uVaI-qkRZek_qgnRWczvoHkglqqKq4IE/319x398',
    'https://dynl.mktgcdn.com/p/4TZwJCbxFZ0qA1I7cMRZ8Tw2Z-pxts2nR5E-XzLLUUE/319x398',
    'https://dynl.mktgcdn.com/p/w5ENc8GAFLVdrybR_fSNjZErNFAuyawOXEDO6qcEbIg/319x398',
    'https://dynl.mktgcdn.com/p/6UC7vVUQbmmdZF2CjWs6V4t_3s6GYu_rydhJOqB67To/319x398',
    'https://dynl.mktgcdn.com/p/4D4pxnuZqrVSds1Gk0_4CukVOzRra25wMnx5yalaW6A/319x398',
    'https://dynl.mktgcdn.com/p/5WipnbqepuqNqTnZLGFgwyig-pY-iYlsQey7joVyKLI/319x398',
    'https://dynl.mktgcdn.com/p/6BA_gLi19OKudLqDduOBujXtLmHcENSmFAAsigG9oLE/319x398',
    'https://dynl.mktgcdn.com/p/1bpkdj7XC5WW0QPNBIePoJnkQEjJDm9asFqRa3nDX-Y/319x398'
  ];

  function buildGrid() {
    const grid = document.getElementById('grid');
    photos.forEach(p => {
      const img = document.createElement('img');
      img.src = p;
      img.alt = p.replace('.jpg','').replace(/-/g,' ');
      img.loading = 'lazy';
      img.onclick = () => {
        document.getElementById('lightboxImg').src = p;
        document.getElementById('lightbox').classList.add('active');
      };
      grid.appendChild(img);
    });
  }

  document.getElementById('lightbox').addEventListener('click', function(e) {
    if (e.target !== document.getElementById('lightboxImg')) {
      this.classList.remove('active');
    }
  });

  buildGrid();
</script>
